<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d1d9cf">
  <meta name="description" content="안정민 · 박선형, 저희 결혼합니다. 있는 그대로 사랑하고 서로의 존재에 감사하며.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="안정민 · 박선형, 저희 결혼합니다">
  <meta property="og:description" content="있는 그대로 사랑하고 서로의 존재에 감사하며">
  <title>안정민 · 박선형, 저희 결혼합니다</title>
  <style>
    :root { color-scheme: light; --sage:#d1d9cf; --ink:#394c3d; --paper:#fcfcf8; --muted:#667360; }
    * { box-sizing:border-box; }
    body { margin:0; background:#edf0eb; color:var(--ink); font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif; word-break:keep-all; }
    main { max-width:480px; margin:auto; background:var(--paper); }
    .cover { min-height:660px; min-height:90svh; padding:76px 26px 60px; background:var(--sage); text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:54px; }
    .eyebrow { margin:0; font-size:.75rem; letter-spacing:.24em; line-height:1.8; }
    .names { font-family:"AppleMyungjo","Batang",serif; font-weight:400; font-size:2rem; letter-spacing:.24em; line-height:1.6; margin:0; }
    .names span { display:block; }
    .names .and { font-size:1rem; font-style:italic; letter-spacing:0; margin:16px 0; color:var(--muted); }
    .cover-note { margin:0; font-size:1rem; letter-spacing:.2em; }
    .message { padding:88px 24px 84px; text-align:center; }
    h2 { font-family:"AppleMyungjo","Batang",serif; font-size:1.5rem; font-weight:400; letter-spacing:.1em; margin:0 0 40px; }
    .greeting { font-size:1.125rem; line-height:2.3; margin:0; }
    .rule { width:1px; height:52px; background:#b5bfae; margin:42px auto; }
    .announcement { font-size:1rem; line-height:2; margin:0; }
    .signature { margin:40px 0 0; font-size:1rem; letter-spacing:.14em; }
    footer { padding:30px 20px; border-top:1px solid #e5e8df; text-align:center; font-size:.75rem; letter-spacing:.2em; color:var(--muted); }
    @media (min-width:600px) { main { margin:36px auto; box-shadow:0 12px 64px #394c3d12; } .cover { min-height:680px; } }
    @media (max-width:340px) { .cover { padding-inline:18px; } .message { padding-inline:18px; } .greeting { font-size:1rem; } }
    @media print { body { background:white; } main { margin:0 auto; box-shadow:none; } .cover { min-height:450px; } }
  </style>
</head>
<body>
  <main>
    <header class="cover">
      <p class="eyebrow">A CELEBRATION OF OUR LOVE</p>
      <h1 class="names"><span>안정민</span><span class="and" aria-hidden="true">&amp;</span><span>박선형</span></h1>
      <p class="cover-note">저희, 결혼합니다</p>
    </header>
    <section class="message" aria-labelledby="message-title">
      <h2 id="message-title">결혼 소식을 전합니다</h2>
      <p class="greeting">있는 그대로 사랑하고<br>서로의 존재에 감사하며</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="announcement">별도의 결혼식 없이<br>저희 두 사람의 새로운 시작을 전합니다.<br><br>따뜻한 마음으로 축복해 주세요.</p>
      <p class="signature">안정민 · 박선형 드림</p>
    </section>
    <footer>WITH LOVE &amp; GRATITUDE</footer>
  </main>
</body>
</html>
